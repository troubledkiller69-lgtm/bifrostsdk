# BIFROST SDK - backend pytest gate.
# Windows-only runner: engine/core modules import ctypes/win32 APIs at
# module level, so a linux runner is not a valid stand-in.
# No packaging here - smoke_bridge.py --packaged needs a PyInstaller build,
# which belongs in its own (follow-up) workflow.
name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: pytest (windows-latest, py3.14)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -q
